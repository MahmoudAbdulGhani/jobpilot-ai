[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-backend"
version = "0.1.0"
description = "Backend for JobPilot AI, a private AI-powered job-search dashboard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.8",
    "email-validator>=2.0",
    "python-multipart>=0.0.9",
    "pypdf>=6.0,<7",
    "python-docx>=1.2,<2",
    "reportlab>=4.4,<5",
    "openai>=2.0,<3",
    "httpx>=0.28,<1",
    "cryptography>=44,<47",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
